# Candidate only. Never include automatically in the running M4 cluster.
# Native PostgreSQL 18 collector; activation requires a planned restart.
logging_collector = on
log_destination = 'stderr'
log_directory = 'chezhi-pg-log'
log_filename = 'postgresql-%Y%m%d-%H%M%S.log'
log_file_mode = 0600
log_timezone = 'UTC'
log_rotation_age = '1d'
log_rotation_size = '10MB'
log_truncate_on_rotation = off
# Do not enable statement/parameter capture for licensing operations.
log_statement = 'none'
log_duration = off
log_min_duration_statement = -1
log_min_duration_sample = -1
log_transaction_sample_rate = 0
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = 'panic'
