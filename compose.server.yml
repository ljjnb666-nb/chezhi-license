name: chezhi-license-server
services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: chezhi
      POSTGRES_USER: chezhi_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chezhi_migrator", "-d", "chezhi"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    profiles: [setup]
    image: chezhi-license-server:local
    build: .
    environment:
      CHEZHI_DATABASE_URL_FILE: /run/secrets/migration_url
      CHEZHI_OWNER_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [migration_url, owner_password]
    command: ["db-init"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: chezhi-license-server:local
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHEZHI_MODE: server
      CHEZHI_LISTEN: 0.0.0.0:8443
      CHEZHI_DIAGNOSTICS: 127.0.0.1:9090
      CHEZHI_PUBLIC_ORIGIN: ${CHEZHI_PUBLIC_ORIGIN:-https://localhost:8443}
      CHEZHI_DATABASE_URL_FILE: /run/secrets/runtime_url
      CHEZHI_CSRF_KEY_FILE: /run/secrets/csrf_key
      CHEZHI_TLS_CERT: /run/secrets/tls_cert
      CHEZHI_TLS_KEY: /run/secrets/tls_key
    secrets: [runtime_url, csrf_key, tls_cert, tls_key]
    ports:
      - "127.0.0.1:${CHEZHI_HTTPS_PORT:-8443}:8443"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 12s
secrets:
  pg_password:
    file: ${CHEZHI_SERVER_SECRETS_DIR:?set CHEZHI_SERVER_SECRETS_DIR}/pg-password
  migration_url:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/migration-url
  owner_password:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/owner-password
  runtime_url:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/runtime-url
  csrf_key:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/csrf-key
  tls_cert:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/tls-cert.pem
  tls_key:
    file: ${CHEZHI_SERVER_SECRETS_DIR}/tls-key.pem
volumes:
  pgdata:
