<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>澈知科技 · 软件授权验证</title><style>
:root{--bg:#f5f5f7;--card:#ffffffd9;--line:#e5e5ea;--text:#1d1d1f;--sub:#6e6e73;--blue:#0071e3;--blue-hover:#0077ed;--green:#1d9a52;--green-bg:#ecf9f0;--red:#b42318;--red-bg:#fff2f1;--shadow:0 20px 42px rgba(15,23,42,.08);--blur:saturate(180%) blur(20px)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at top,#ffffff 0,#f7f8fb 40%,#f2f3f7 100%);display:flex;align-items:center;justify-content:center;padding:24px}main{width:min(100%,520px);background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.75);border-radius:30px;box-shadow:var(--shadow);padding:30px 26px}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#415067;background:#eef3ff;border:1px solid #d8e4ff;border-radius:999px;padding:8px 12px;margin-bottom:14px}.brand{margin-bottom:10px}h1{font-size:31px;line-height:1.05;letter-spacing:-.03em;margin:0 0 8px}h2{font-size:20px;margin:22px 0 10px;letter-spacing:-.02em}p,small{color:var(--sub)}.intro{margin:0 0 16px}.msg,.error{padding:12px 14px;border-radius:16px;margin:12px 0}.msg{background:var(--green-bg);color:var(--green);border:1px solid #b7e1c6}.error{background:var(--red-bg);color:var(--red);border:1px solid #f1c0bb}label{display:block;margin:14px 0 6px;font-size:13px;font-weight:600;color:#3b3b40}input{width:100%;padding:13px 14px;border:1px solid var(--line);background:#fbfbfd;border-radius:16px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}input:focus{border-color:#86b7ff;box-shadow:0 0 0 4px rgba(0,113,227,.12);background:#fff}button{width:100%;margin-top:18px;min-height:46px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(0,113,227,.18);transition:.2s ease}button:hover{background:var(--blue-hover);transform:translateY(-1px)}.support{margin-top:22px;padding:18px;border-radius:22px;background:linear-gradient(180deg,#fff,#fafbfd);border:1px solid var(--line)}.support strong{display:block;margin:8px 0 2px;font-size:24px;letter-spacing:-.02em}.back{display:inline-flex;margin-top:18px;color:var(--blue);text-decoration:none}.back:hover{text-decoration:underline}@media(max-width:560px){body{padding:14px}main{padding:24px 18px;border-radius:24px}h1{font-size:26px}}
</style></head><body><main><div class="eyebrow">独立用户激活页 · 无需管理员密码</div><div class="brand"><h1>澈知科技</h1><p class="intro">CheZhi License · 软件授权验证</p></div><h2>输入卡密并完成激活</h2><p class="intro">请输入授权卡密及测试设备标识。该页面仅用于用户自助激活，不显示后台管理信息。</p>{{if .Message}}<div class="msg" role="status">{{.Message}}<br>有效期至：{{.Expiry}}</div>{{end}}{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}<form method="post" action="/activate"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="key">授权卡密</label><input id="key" name="key" required maxlength="100" autocomplete="off" placeholder="请输入购买后获得的卡密"><label for="device">测试设备标识</label><input id="device" name="device" required maxlength="200" value="test-device-A"><small>当前仍是本机演练，不代表真实硬件指纹。</small><button>激活 / 验证</button></form><div class="support">购买卡密可添加 QQ：<strong>{{.QQ}}</strong><small>人工确认收款后发卡；当前仅作内部演练，不收款。</small></div><a class="back" href="/purchase">查看套餐与购买说明 →</a></main></body></html>
