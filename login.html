<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 澈知科技</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f7;color:#1d1d1f;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(100%,400px);background:white;border:1px solid #e5e5ea;border-radius:22px;padding:36px;box-shadow:0 16px 48px #0000000b}.mark{background:#1d1d1f;color:white;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-weight:700}h1{font-size:26px;margin:24px 0 4px;letter-spacing:-.03em}p{color:#6e6e73;margin:0 0 24px}label{display:block;font-weight:600;font-size:13px;margin:16px 0 6px}input{width:100%;border:1px solid #d7d7dc;border-radius:10px;background:#fafafa;font:inherit;padding:12px}button{width:100%;margin-top:24px;background:#0071e3;color:white;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#0066cc}:focus-visible{outline:3px solid #78b5ff;outline-offset:2px}.error{background:#fff0ef;color:#a32220;padding:12px;border-radius:10px;margin-bottom:12px}footer{font-size:12px;color:#6e6e73;margin-top:22px;text-align:center}</style></head><body><main><div class="mark">CZ</div><h1>登录授权管理</h1><p>澈知科技 · 管理工作台</p>{{if .Error}}<div role="alert" class="error">{{.Error}}</div>{{end}}<form method="post" action="/login"><input type="hidden" name="login_csrf" value="{{.CSRF}}"><label for="username">账号</label><input id="username" name="username" autocomplete="username" value="admin" required maxlength="80"><label for="password">密码</label><input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128"><button>登录</button></form><footer>仅限授权管理员访问</footer></main></body></html>
