name: CheZhi License CI

on:
  pull_request:
    branches: [main, feature/p6-termux-staging, feature/m5-m6-local-api-gateway]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce_dashboard_slo:
        description: Require the repeated 500 ms target on the selected runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go regression (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.23.x'
          - os: ubuntu-24.04
            go: '1.26.11'
          - os: windows-2025
            go: '1.26.11'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 -v ./...
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -o bin/chezhi-license-win-x64.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash bin/chezhi-license-win-x64.exe -Algorithm SHA256).Hash
      - if: runner.os == 'Windows'
        name: Build native SDK and exercise .NET Framework ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if (-not $gcc) {
            $candidate = 'C:\mingw64\bin\gcc.exe'
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { throw 'x64 MinGW gcc unavailable on runner' }
            $env:Path = (Split-Path -Parent $candidate) + ';' + $env:Path
            $gcc = Get-Command gcc.exe
          }
          $machine = (& $gcc.Source -dumpmachine)
          if ($LASTEXITCODE -ne 0 -or $machine -notmatch '^x86_64.*mingw') { throw "Unexpected native toolchain: $machine" }
          & $gcc.Source --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '1'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CC = $gcc.Source
          go build -trimpath -buildmode=c-shared -o bin/chezhi_license_sdk.dll ./cmd/windows-license-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $smoke = (Resolve-Path -LiteralPath 'sdk/windows/AbiSmoke.cs').Path
          $abiOut = Join-Path $PWD 'bin\AbiSmoke.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$abiOut" $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./bin/AbiSmoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash bin/chezhi_license_sdk.dll -Algorithm SHA256).Hash
      - if: runner.os == 'Windows'
        name: Windows persistent CNG software key lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $src = (Resolve-Path -LiteralPath 'sdk/windows/WindowsDeviceKey.cs').Path
          $test = (Resolve-Path -LiteralPath 'sdk/windows/DeviceKeySmoke.cs').Path
          $exe = Join-Path $PWD 'bin\DeviceKeySmoke.exe'
          & $csc /nologo /target:exe /platform:x64 /r:System.Core.dll "/out:$exe" $src $test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $slot = [Guid]::NewGuid().ToString()
          $fingerprint = (& $exe create $slot | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch '^[0-9a-f]{64}$') { throw 'CNG enrollment fixture failed' }
          try {
            & $exe reopen $slot $fingerprint
            if ($LASTEXITCODE -ne 0) { throw 'CNG reopen fixture failed' }
          } finally {
            & $exe cleanup $slot $fingerprint
            if ($LASTEXITCODE -ne 0) { throw 'CNG fixture cleanup failed' }
          }
      - if: runner.os == 'Windows'
        name: Windows DPAPI enrollment transaction and crash recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $src = (Resolve-Path -LiteralPath 'sdk/windows/WindowsDeviceKey.cs').Path
          $enrollment = (Resolve-Path -LiteralPath 'sdk/windows/DeviceEnrollment.cs').Path
          $test = (Resolve-Path -LiteralPath 'sdk/windows/EnrollmentSmoke.cs').Path
          $exe = Join-Path $PWD 'bin\EnrollmentSmoke.exe'
          & $csc /nologo /target:exe /platform:x64 /define:CHEZHI_SDK_TEST /r:System.Core.dll /r:System.Security.dll "/out:$exe" $src $enrollment $test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Authorization state and concurrency invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $src = (Resolve-Path -LiteralPath 'sdk/windows/AuthorizationState.cs').Path
          $test = (Resolve-Path -LiteralPath 'sdk/windows/AuthorizationStateSmoke.cs').Path
          $exe = Join-Path $PWD 'bin\AuthorizationStateSmoke.exe'
          & $csc /nologo /target:exe /platform:x64 "/out:$exe" $src $test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os == 'Windows'
        name: Windows native online interop and coordinator
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          go build -tags sdkfixture -trimpath -o bin/SdkTestServer.exe ./cmd/sdk-test-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $sources = @('AuthorizationState.cs','WindowsDeviceKey.cs','NativeLicenseClient.cs','LicenseCoordinator.cs','OnlineSmoke.cs') | ForEach-Object { (Resolve-Path -LiteralPath ('sdk/windows/'+$_)).Path }
          $exe = Join-Path $PWD 'bin\OnlineSmoke.exe'
          & $csc /nologo /target:exe /platform:x64 /r:System.Core.dll "/out:$exe" $sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./sdk/windows/Run-OnlineSmoke.ps1 -Bin bin
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-ci-build
          path: bin/chezhi-license-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  integration:
    name: HTTP and migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Python acceptance syntax preflight
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          for path in sorted(pathlib.Path('.').glob('*.py')) + sorted(pathlib.Path('migration').rglob('*.py')):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print("PYTHON_ACCEPTANCE_SYNTAX_PASS")
          PY
      - name: Build and run live HTTP tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-license-linux-amd64 .
          for test in http_smoke.py client_http_smoke.py session_http_smoke.py members_http_smoke.py owner_http_smoke.py; do
            echo "Running $test"
            timeout 120s python3 "$test" ./bin/chezhi-license-linux-amd64
          done
      - name: Migration and recovery
        run: |
          (cd migration && python3 -m unittest -v)
          timeout 120s python3 migration/runtime_rehearsal.py ./bin/chezhi-license-linux-amd64
      - name: JavaScript syntax
        run: node --check admin-ui.js

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject committed runtime files and obvious credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\x00')
          forbidden = {'state.json', 'plans.json', 'members.json', 'owner.json', 'instance.lock', '.pgpass', 'pgpass.conf', 'pg_service.conf'}
          extensions = {'.exe', '.db', '.sqlite', '.sqlite3', '.zip', '.log', '.jsonl', '.pem', '.key', '.p12', '.pfx', '.dump', '.pgdump', '.backup', '.bak'}
          patterns = [r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----', r'gh[pousr]_[A-Za-z0-9]{30,}', r'github_pat_[A-Za-z0-9_]{40,}', r'AKIA[A-Z0-9]{16}']
          bad = []
          for name in filter(None, paths):
              p = pathlib.Path(name)
              if p.parts[0].lower() in {'data', 'bin', 'backups'} or p.name.lower() in forbidden or p.suffix.lower() in extensions or p.name.lower().endswith(('.sql.gz', '.dump.gz', '.pgdump.gz')) or (p.name.lower().startswith('.env') and p.name != '.env.example'):
                  bad.append((name, 'runtime or secret file'))
              if p.as_posix() == '.github/workflows/ci.yml':
                  continue  # scanner contains its own pattern definitions
              raw = p.read_bytes()
              if raw.startswith(b'PGDMP') or b'-- PostgreSQL database dump' in raw[:1024]:
                  bad.append((name, 'PostgreSQL dump content'))
              if any(re.search(pattern, raw.decode('utf-8', errors='replace')) for pattern in patterns):
                  bad.append((name, 'possible credential'))
          for name, reason in bad:
              print(f'{reason}: {name}', file=sys.stderr)
          if bad:
              sys.exit(1)
          print('Repository hygiene checks passed; not a comprehensive secret or vulnerability scan.')
          PY

  dependency-security:
    name: Dependency and toolchain security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify modules and scan the shipping toolchain
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p bin
          go version | tee bin/security-verification.txt
          go mod download
          go mod verify | tee -a bin/security-verification.txt
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./... | tee -a bin/security-verification.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security
          path: bin/security-verification.txt
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: Chromium browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Prepare browser test environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          # The hosted image's unrelated Microsoft APT feed can return 403.
          # Temporarily exclude only its dedicated source files, retaining
          # Ubuntu security repositories and normal signed-package checks.
          saved="$(mktemp -d)"
          restore_sources() {
            for file in "$saved"/*; do
              [ -f "$file" ] || continue
              sudo mv "$file" /etc/apt/sources.list.d/
            done
            rmdir "$saved"
          }
          trap restore_sources EXIT
          for file in /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; do
            if [ -f "$file" ] && grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$file"; then
              sudo mv "$file" "$saved/"
            fi
          done
          .ci-venv/bin/python -m playwright install --with-deps chromium
      - name: Run Chromium tests
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-license-linux-amd64 .
          timeout 180s .ci-venv/bin/python browser_e2e.py ./bin/chezhi-license-linux-amd64

  postgres:
    name: PostgreSQL persistence and HTTP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: chezhi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d chezhi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Real database integration with race detector
        env:
          CHEZHI_TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/chezhi?sslmode=disable
        run: |
          set -euo pipefail
          mkdir -p bin
          go test -race -run '^TestPostgres' -count=1 -v ./... | tee bin/postgres-test.txt
      - name: Database commands, HTTP and native backup recovery
        env:
          CHEZHI_TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/chezhi?sslmode=disable
          CHEZHI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-license .
          python3 migration/postgres_acceptance.py ./bin/chezhi-license | tee bin/postgres-acceptance.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-acceptance
          path: bin/postgres-*.txt
          retention-days: 7
          if-no-files-found: warn

  standalone:
    name: Standalone HTTPS server and container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: chezhi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d chezhi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build shipping binary and container
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-server .
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-gateway ./cmd/license-gateway
          docker build --tag chezhi-server:ci .
      - name: Two-process TLS, proxy, shared state and native container smoke
        env:
          CHEZHI_TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/chezhi?sslmode=disable
          CHEZHI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CHEZHI_TEST_CONTAINER_IMAGE: chezhi-server:ci
          CHEZHI_TEST_GATEWAY_BINARY: ./bin/chezhi-gateway
          CHEZHI_TEST_GATEWAY_PACED: '1'
          CHEZHI_TEST_CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
        run: |
          set -euo pipefail
          python3 migration/server_acceptance.py ./bin/chezhi-server | tee bin/standalone-acceptance.txt
          grep -F 'PASS GATEWAY_REAL_V2' bin/standalone-acceptance.txt
          grep -F 'PASS GATEWAY_PACED' bin/standalone-acceptance.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-acceptance
          path: bin/standalone-acceptance.txt
          retention-days: 7
          if-no-files-found: warn

  dashboard-benchmark:
    name: Dashboard benchmark and plan comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: chezhi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          # The benchmark restarts PostgreSQL to clear shared buffers.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chezhi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build audited baseline and proposed server on the same runner
        run: |
          set -euo pipefail
          baseline=b89a21b4cb9c174e12e8d41f344ba59cd88fd81e
          git fetch --no-tags --depth=1 origin "$baseline"
          mkdir -p bin/performance "$RUNNER_TEMP/chezhi-audited"
          git archive "$baseline" | tar -x -C "$RUNNER_TEMP/chezhi-audited"
          CGO_ENABLED=0 go build -trimpath -o "$PWD/bin/performance/optimized" .
          target="$PWD/bin/performance/audited"
          (cd "$RUNNER_TEMP/chezhi-audited" && CGO_ENABLED=0 go build -trimpath -o "$target" .)
      - name: Repeated identical HTTPS profiles and EXPLAIN ANALYZE BUFFERS
        env:
          CHEZHI_TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/chezhi?sslmode=disable
          CHEZHI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CHEZHI_PERF_PROFILE: benchmark
          CHEZHI_BENCHMARK_ONLY: '1'
          CHEZHI_PERF_COLD_DB: '1'
          CHEZHI_PLAN_DIR: bin/performance/plans
          ENFORCE_TARGET: ${{ inputs.enforce_dashboard_slo }}
        run: |
          set -euo pipefail
          CHEZHI_AUDITED_BASELINE=1 python3 migration/server_acceptance.py ./bin/performance/audited | tee bin/performance/audited.txt
          enforce=0
          if [ "$ENFORCE_TARGET" = true ]; then enforce=1; fi
          CHEZHI_REQUIRE_PERF="$enforce" python3 migration/server_acceptance.py ./bin/performance/optimized | tee bin/performance/optimized.txt
          echo "### HTTPS 500 ms target (median of three trial P95s)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(SLO|PERFORMANCE_500MS_TARGET)' bin/performance/optimized.txt >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dashboard-benchmark
          path: |
            bin/performance/*.txt
            bin/performance/plans/*.json
          retention-days: 14
          if-no-files-found: warn

  termux-staging:
    name: Android ARM64 build and Termux staging preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Isolated runit lifecycle and daily backup fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v runsv >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends runit
          fi
          timeout 180s bash migration/termux/test-supervisor.sh
      - name: Syntax, cross-build and unsigned candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          for script in migration/termux/*.sh; do bash -n "$script"; done
          mkdir -p bin/termux-staging/migration/termux
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -o bin/termux-staging/chezhi-server-android-arm64 .
          readelf -h bin/termux-staging/chezhi-server-android-arm64 | grep -E 'Machine:.*AArch64'
          go version -m bin/termux-staging/chezhi-server-android-arm64 | tee bin/termux-staging/build-info.txt
          grep -F 'GOOS=android' bin/termux-staging/build-info.txt
          grep -F 'GOARCH=arm64' bin/termux-staging/build-info.txt
          cp migration/termux/staging.sh migration/termux/supervisor.sh migration/termux/managed-backup.sh migration/termux/README.md bin/termux-staging/migration/termux/
          cp migration/postgres_runtime_grants.sql bin/termux-staging/migration/
          git rev-parse HEAD > bin/termux-staging/source-commit.txt
          printf '%s\n' 'UNSIGNED ANDROID STAGING CANDIDATE: build only; no phone or PostgreSQL 18 acceptance' > bin/termux-staging/NOTICE
          (cd bin/termux-staging && sha256sum chezhi-server-android-arm64 migration/termux/staging.sh migration/termux/supervisor.sh migration/termux/managed-backup.sh migration/termux/README.md migration/postgres_runtime_grants.sql source-commit.txt build-info.txt NOTICE > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termux-android-arm64-unsigned-staging
          path: bin/termux-staging/
          if-no-files-found: error
          retention-days: 14

  termux-postgres18:
    name: PostgreSQL 18 compatibility gate for Termux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Compatibility probe only; not the pinned production PG17 image.
        image: postgres:18.7-alpine
        env:
          POSTGRES_DB: chezhi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d chezhi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Record actual compatibility image and execute existing checks
        env:
          CHEZHI_TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/chezhi?sslmode=disable
          CHEZHI_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p bin
          docker image inspect postgres:18.7-alpine --format '{{json .RepoDigests}}'
          docker exec "$CHEZHI_TEST_POSTGRES_CONTAINER" postgres --version
          go test -race -run '^TestPostgres' -count=1 -v ./... | tee bin/pg18-test.txt
          CGO_ENABLED=0 go build -trimpath -o bin/chezhi-license .
          python3 migration/postgres_acceptance.py ./bin/chezhi-license | tee bin/pg18-acceptance.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres18-compatibility-evidence
          path: bin/pg18-*.txt
          retention-days: 7
          if-no-files-found: warn

  local-license-gateway:
    name: M5 M6 isolated license gateway and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Loopback TLS isolation and cross-build
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./cmd/license-gateway
          go vet ./cmd/license-gateway
          mkdir -p bin/local-license-gateway
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -o bin/local-license-gateway/chezhi-gateway-android-arm64 ./cmd/license-gateway
          readelf -h bin/local-license-gateway/chezhi-gateway-android-arm64 | grep -E 'Machine:.*AArch64'
          git rev-parse HEAD > bin/local-license-gateway/source-commit.txt
          cp migration/termux/GATEWAY.md migration/termux/cloudflared.disabled.yml bin/local-license-gateway/
          printf '%s\n' 'UNSIGNED LOCAL TEST ONLY; NO TUNNEL OR PUBLIC DEPLOYMENT' > bin/local-license-gateway/NOTICE
          (cd bin/local-license-gateway && sha256sum chezhi-gateway-android-arm64 source-commit.txt GATEWAY.md cloudflared.disabled.yml NOTICE > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-license-gateway-android-arm64-unsigned
          path: bin/local-license-gateway/
          if-no-files-found: error
          retention-days: 14
